[project]
name = "frame-slicer"
version = "0.1.0"
description = "Split a frame range into equal slices and submit them to QueueWatch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1.7,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0,<6",
    "black>=24.0",
    "flake8>=7.1",
    "isort>=5.13",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[project.scripts]
frame-slicer = "frame_slicer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frame_slicer*"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=frame_slicer --cov-report=term-missing"
