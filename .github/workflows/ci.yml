name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/python-checks.yml
    with:
      package: frame_slicer
      coverage-min: 100
      lint-command: |
        black --check .
        isort --check .
        flake8 frame_slicer/ tests/
        mypy frame_slicer/
        vulture frame_slicer/ vulture_whitelist.py
      smoke-command: |
        frame-slicer --version
        frame-slicer split 1-10 --slices 2
        frame-slicer commands 1-10 --slices 2 --tool blender --scene s.blend
