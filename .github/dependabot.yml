version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["black", "isort", "flake8", "mypy", "pytest*", "vulture", "pip-audit", "build", "twine"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
